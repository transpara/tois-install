# TOIS API + scheduler pod.
#
# Single replica: SQLite on a PVC = single writer, never two pods at once.
# Recreate strategy so a rolling update never briefly runs two pods
# against the same volume.
#
# Two configuration surfaces:
# - `/app/tois.yaml` (ConfigMap): ops-time config — scopes, per-agent
#   overrides, business weights. Fixed per deployment, edited by ops.
# - `/data/tois-settings.json` (on the PVC): runtime-tunable settings —
#   gateway URL + api key, Transpara creds, MCP URL, enricher choice,
#   narrative model. Edited by operators through the Settings page;
#   the install script seeds this file on first deploy.
#
# Env vars for the runtime-tunable fields (TOIS_TRANSPARA_*,
# TOIS_GATEWAY_*, TOIS_ENRICHER, TOIS_NARRATIVE_MODEL, TOIS_MCP_URL)
# used to live here — they moved into the store. Anything still setting
# them via env is ignored.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tois-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # zfs (OpenEBS local-pv) is the production storage class on this cluster.
  # local-path also works and is the k3s default; pin zfs so restarts land
  # on the same volume without depending on default-class election.
  storageClassName: zfs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tois-config
data:
  tois.yaml: |
    # TOIS runtime config, mounted at /app/tois.yaml in the container.
    # The Settings API can persist edits back here when the ConfigMap
    # is bound writable — for now this ships as read-only defaults; use
    # env vars for anything that changes per-site.
    scopes:
      - entity_id: 4b11aadc-057f-5d68-a48d-04cd710d235d
        entity_path: AvistaPower
        label: Avista Power
    agents:
      stub:
        enabled: false
    business_weights: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tois
  labels:
    app: tois
spec:
  replicas: 1
  # SQLite on the volume: single writer, never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tois
  template:
    metadata:
      labels:
        app: tois
    spec:
      # Fresh PVCs on OpenEBS are root-owned; fsGroup makes /data writable
      # by appuser (UID 1000, matches the Dockerfile) so SQLite can create
      # its files.
      securityContext:
        fsGroup: 1000
      containers:
        - name: tois
          # Public registry (anonymous pull). CI pushes on merge to main
          # (see .github/workflows/build-image.yml): mutable `latest` +
          # an immutable git-SHA tag for provenance. Match the digest
          # via `kubectl describe pod` and the SHA tag in Harbor.
          image: registry.transpara.com/transpara/tois:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8788
          env:
            - name: TOIS_DATABASE_URL
              value: "sqlite:////data/tois.db"
            - name: TOIS_CONFIG_FILE
              value: "/app/tois.yaml"
            # Runtime-tunable settings file. Editable via the Settings
            # page; the install script seeds it on first deploy.
            - name: TOIS_SETTINGS_FILE
              value: "/data/tois-settings.json"
            - name: TOIS_LOG_LEVEL
              value: "INFO"
            - name: TOIS_AUTO_RESOLVE_AFTER_CLEAN_RUNS
              value: "3"
            - name: TOIS_TGRAPH_REPLY_SEVERITIES
              value: "critical,high"
            # Scheduler off in the deployed PoC; all runs operator-triggered.
            - name: TOIS_RUN_SCHEDULER
              value: "false"
            # No CORS needed: the nginx sidecar (tois-ui) proxies same-origin.
            - name: TOIS_CORS_ALLOW_ORIGINS
              value: ""
          # Kyverno pod-security baseline: runAsNonRoot + seccomp default,
          # no privileged, no host anything. TOIS doesn't need any of that.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tois-data
              mountPath: /data
            - name: tois-config
              mountPath: /app/tois.yaml
              subPath: tois.yaml
          readinessProbe:
            httpGet:
              path: /health
              port: 8788
            initialDelaySeconds: 5
            periodSeconds: 10
          # Generous liveness: an agent run can hold the event loop for
          # tens of seconds. Don't restart mid-run over one slow probe.
          livenessProbe:
            httpGet:
              path: /health
              port: 8788
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: tois-data
          persistentVolumeClaim:
            claimName: tois-data
        - name: tois-config
          configMap:
            name: tois-config
---
apiVersion: v1
kind: Service
metadata:
  name: tois
spec:
  # ClusterIP: tois-ui reaches it in-cluster; no direct external access.
  type: ClusterIP
  selector:
    app: tois
  ports:
    - port: 8788
      targetPort: 8788
      protocol: TCP
