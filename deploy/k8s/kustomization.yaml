# TOIS on k3s.
#
# Deploys TOIS API + UI into the SHARED `model-builder` namespace,
# alongside the `claude-subscription-gateway` (which both TOIS and
# Model Builder use). Order-independent with model-builder-install:
# whichever installer runs first creates the namespace + gateway;
# the second reuses them via `kubectl apply -k` (no-ops on identical
# objects).
#
# (Eventual home for this namespace is `transpara` — same as the
# rest of the platform pods. Deferred to a coordinated migration
# across all Transpara apps.)
#
# Prerequisites:
#   - `gateway-secrets` Secret with CSG_API_KEY (+ CSG_ADMIN_PASSWORD,
#     optionally CSG_CLAUDE_OAUTH_TOKEN). Created by the install script
#     if missing.
#
# Deploy (via install script, not directly):
#   ./install-tois.sh
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: model-builder
resources:
  - namespace.yaml
  - gateway.yaml
  - network-policy.yaml
  - tois.yaml
  - tois-ui.yaml
